<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>篠崎友寿｜門司港で取り組んでいること</title>
  <meta name="description" content="篠崎友寿・株式会社LAM COMPANYが門司港で取り組んでいるプロジェクトをご案内します。">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#102f47">
  <link rel="canonical" href="https://www.moji-lamcompany.com/links">
  <style>
    :root {
      --navy: #102f47;
      --navy-deep: #0a2133;
      --orange: #e36d36;
      --paper: #f5f2eb;
      --white: #fff;
      --ink: #163047;
      --muted: #677784;
      --line: rgba(16, 47, 71, .13);
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 3%, rgba(227, 109, 54, .13), transparent 30%),
        linear-gradient(160deg, #faf9f5 0%, var(--paper) 62%, #edf1f2 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }

    .page {
      width: min(100%, 430px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile { text-align: center; }

    .portrait {
      width: 76px;
      height: 76px;
      margin: 0 auto 10px;
      border: 3px solid var(--white);
      border-radius: 50%;
      object-fit: cover;
      object-position: 64% 38%;
      box-shadow: 0 10px 28px rgba(10, 33, 51, .19);
    }

    .profile h1 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.35;
      letter-spacing: .02em;
    }

    .profile p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .links {
      display: grid;
      gap: 9px;
    }

    .link-card {
      position: relative;
      min-height: 64px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 11px;
      padding: 9px 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(10, 33, 51, .07);
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--orange);
    }

    .link-card:active { transform: scale(.985); }

    .link-card:focus-visible {
      outline: 3px solid rgba(227, 109, 54, .45);
      outline-offset: 3px;
    }

    .icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #edf2f4;
      color: var(--navy);
    }

    .icon svg,
    .arrow svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label { min-width: 0; }

    .label strong {
      display: block;
      font-size: .96rem;
      line-height: 1.35;
      letter-spacing: .01em;
    }

    .label small {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      display: grid;
      place-items: center;
      color: #81909a;
    }

    .crowdfunding {
      min-height: 56px;
      margin-left: 16px;
      grid-template-columns: 35px minmax(0, 1fr) auto;
      border-style: dashed;
      background: rgba(255, 255, 255, .62);
      box-shadow: none;
      cursor: default;
    }

    .crowdfunding::before {
      left: -11px;
      top: -10px;
      bottom: auto;
      width: 18px;
      height: 38px;
      border: 0 solid rgba(16, 47, 71, .24);
      border-width: 0 0 1px 1px;
      border-radius: 0 0 0 9px;
      background: none;
    }

    .crowdfunding .icon {
      width: 35px;
      height: 35px;
      background: rgba(227, 109, 54, .11);
      color: var(--orange);
    }

    .line-link .icon {
      background: rgba(6, 199, 85, .11);
      color: #06a947;
    }

    .status {
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(227, 109, 54, .12);
      color: #b54f24;
      font-size: .67rem;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (hover: hover) {
      a.link-card:hover {
        transform: translateY(-2px);
        border-color: rgba(227, 109, 54, .38);
        box-shadow: 0 12px 30px rgba(10, 33, 51, .12);
      }
    }

    @media (max-height: 700px) {
      main { padding-top: max(10px, env(safe-area-inset-top)); }
      .page { gap: 10px; }
      .portrait { width: 62px; height: 62px; margin-bottom: 7px; }
      .profile h1 { font-size: 1.08rem; }
      .profile p { font-size: .74rem; }
      .links { gap: 7px; }
      .link-card { min-height: 56px; padding-top: 7px; padding-bottom: 7px; }
      .crowdfunding { min-height: 50px; }
      .icon { width: 36px; height: 36px; border-radius: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="page">
      <header class="profile">
        <img class="portrait" src="/images/profile.webp" alt="篠崎友寿" width="600" height="337">
        <h1>篠崎 友寿</h1>
        <p>門司港で取り組んでいること</p>
      </header>

      <nav class="links" aria-label="取り組みへのリンク">
        <a class="link-card" href="/coworking">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12"/><path d="M8 20v-5h8v5M8 10h.01M12 10h.01M16 10h.01"/></svg>
          </span>
          <span class="label"><strong>コワーキング門司港</strong><small>学ぶ・働く・つながる場所を準備中</small></span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </a>

        <div class="link-card crowdfunding" aria-disabled="true">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/></svg>
          </span>
          <span class="label"><strong>クラウドファンディング</strong><small>コワーキング門司港の開業に向けて</small></span>
          <span class="status">準備中</span>
        </div>

        <a class="link-card" href="https://sakaemachi-marche.com/">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 10h16M5 10l1-6h12l1 6"/><path d="M6 10v10h12V10M9 20v-6h6v6"/><path d="M4 10c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2"/></svg>
          </span>
          <span class="label"><strong>栄町マルシェ</strong><small>商店街の日曜日を、もっと楽しく</small></span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </a>

        <a class="link-card line-link" href="https://lin.ee/Uq0cZmR">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9.5 9.5 0 0 1-3-.5L4 21l1.5-4A7 7 0 0 1 4 12c0-4.4 3.6-8 8-8s8 3.1 8 7.5Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
          </span>
          <span class="label"><strong>LINE公式アカウント</strong><small>出店をご希望の方はご登録ください。</small></span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </a>

      </nav>

    </div>
  </main>
</body>
</html>
